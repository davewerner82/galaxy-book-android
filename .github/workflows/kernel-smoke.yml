name: Smoke test experimental Zenith kernel
on:
  workflow_run:
    workflows: ['Galaxy Book 12 - Zenith kernel build']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: galaxy-book-experimental-kernel
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify kernel, module ABI and early userspace
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c candidate/candidate-sha256.txt
          release=$(cat candidate/candidate-version.txt)
          module_dir="candidate/lib/modules/$release"
          test -s "$module_dir/modules.dep"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 busybox-static cpio kmod
          module=$(find "$module_dir" -type f -name 'i915.ko*' -print -quit)
          test -n "$module"
          vermagic=$(modinfo -F vermagic "$module")
          test "${vermagic%% *}" = "$release"
          mkdir -p ramfs/{bin,dev,proc}
          cp /bin/busybox ramfs/bin/
          cat > ramfs/init <<'EOF'
          #!/bin/busybox sh
          /bin/busybox mount -t proc proc /proc || exit 1
          echo "ZENITH_SMOKE_OK $(/bin/busybox uname -r)"
          /bin/busybox poweroff -f
          EOF
          chmod 755 ramfs/init
          sudo mknod ramfs/dev/console c 5 1
          (cd ramfs && find . -print0 | cpio --null -o --format=newc --owner=0:0) | gzip -1 > smoke.cpio.gz
          timeout 240 qemu-system-x86_64 -accel tcg -cpu max -m 1024 -smp 2 -display none -serial stdio -monitor none -no-reboot -nic none -kernel candidate/kernel -initrd smoke.cpio.gz -append 'console=ttyS0 rdinit=/init panic=1' | tee serial.log
          tr -d '\r' < serial.log | grep -Fx "ZENITH_SMOKE_OK $release"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-serial-log
          path: serial.log
          retention-days: 7
